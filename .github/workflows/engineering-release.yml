name: Release CircuitCraft Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/RELEASE_NOTES_0.3.1.md
      - .github/workflows/engineering-release.yml
permissions:
  contents: write
concurrency:
  group: circuitcraft-windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read release version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Reject an already published version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tags = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing releases." }
          if ($tags.tagName -contains "v$version") { throw "Release v$version already exists; bump the version." }
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: python -m pip install py7zr
      - run: python scripts/prepare_engine.py
      - run: python scripts/assemble_packages.py --only third-party/ngspice-47.tar.gz
      - run: .\scripts\Build-Windows.ps1
      - run: .\scripts\Test-Windows-Engine.ps1
      - run: python scripts/package_engineering.py
      - uses: actions/upload-artifact@v7
        with:
          name: CircuitCraft-Windows-${{ steps.version.outputs.version }}
          path: |
            downloads/CircuitCraft-${{ steps.version.outputs.version }}-Windows-x64.zip
            downloads/SHA256SUMS-${{ steps.version.outputs.version }}.txt
            verification/windows-engine-report.txt
      - name: Publish verified Windows package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create "v$version" "downloads/CircuitCraft-$version-Windows-x64.zip" "downloads/SHA256SUMS-$version.txt" --target "$env:GITHUB_SHA" --title "CircuitCraft $version — Windows maintenance release" --notes-file "docs/RELEASE_NOTES_$version.md"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
