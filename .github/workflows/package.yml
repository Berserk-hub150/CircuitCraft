name: Verify legacy package archives
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - downloads/parts/**
      - third-party/parts/**
      - downloads/packages.json
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/assemble_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: CircuitCraft-legacy-package-verification
          path: downloads/SHA256SUMS.txt
