name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y ngspice libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
        env:
          CIRCUITCRAFT_NGSPICE_TESTS: "1"
      - run: cargo build --workspace --profile dist
      - run: python -m pip install gerbonara && python scripts/verify_fabrication.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: python -m pip install py7zr && python scripts/prepare_engine.py
      - run: .\scripts\Build-Windows.ps1
      - run: .\scripts\Test-Windows-Engine.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CircuitCraft-windows-ci
          path: |
            windows/
            verification/windows-engine-report.txt
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
